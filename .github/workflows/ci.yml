name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,llvm-tools-preview,rustfmt
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2,cargo-deny@0.20.2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo deny check licenses
      - run: cargo about generate about.hbs > /dev/null
      # CLI tests launch the instrumented binary repeatedly; serial execution
      # prevents concurrent child processes from clobbering the same profile.
      - run: cargo llvm-cov --all-targets --locked --fail-under-lines 90.01 -- --test-threads=1
