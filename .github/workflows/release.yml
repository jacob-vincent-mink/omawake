name: Release

on:
  push:
    tags: ["v*.*.*", "v*.*.*-rc*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            ort_arch: x64
            package_arch: x86_64
            ort_sha256: a5ed5a3cac51fbb2e90da632ae43d19212faaa20e76484e62bcb7c23ddb3b3fd
          - runner: ubuntu-22.04-arm
            ort_arch: aarch64
            package_arch: aarch64
            ort_sha256: e16a27a8ed330bbc698df7330b0cf56e722f354e3bcc92118682c74ef3c3e3da
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      OMA_ORT_ROOT: /tmp/onnxruntime-linux-${{ matrix.ort_arch }}-1.30.0
      OMA_MODEL_ROOT: /tmp/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
      ORT_ARCHIVE_SHA256: ${{ matrix.ort_sha256 }}
      ORT_VERSION: 1.30.0
      MODEL_ARCHIVE_SHA256: f170013b4716e41b62b9bfd809687c207cef798ef9bc6534d524e17af9b6561a
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bzip2 ca-certificates curl libasound2-dev pkg-config xz-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Download pinned ONNX Runtime
        run: |
          set -euo pipefail
          archive="/tmp/onnxruntime-linux-${{ matrix.ort_arch }}-${ORT_VERSION}.tgz"
          curl -fsSL --retry 3 -o "${archive}" \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-${{ matrix.ort_arch }}-${ORT_VERSION}.tgz"
          printf '%s  %s\n' "${ORT_ARCHIVE_SHA256}" "${archive}" | sha256sum -c -
          tar -C /tmp -xzf "${archive}"
          test -f "${OMA_ORT_ROOT}/lib/libonnxruntime.so.${ORT_VERSION}"
      - name: Test and build
        run: |
          cargo test --locked
          cargo build --release --locked
      - name: Validate direct keyword parity
        run: |
          set -euo pipefail
          archive=/tmp/omawake-kws-model.tar.bz2
          curl -fsSL --retry 3 -o "${archive}" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2
          printf '%s  %s\n' "${MODEL_ARCHIVE_SHA256}" "${archive}" | sha256sum -c -
          tar -C /tmp -xjf "${archive}"
          scripts/validate-direct-kws.sh \
            target/release/omawake \
            "${OMA_ORT_ROOT}/lib/libonnxruntime.so.${ORT_VERSION}" \
            "${OMA_MODEL_ROOT}"
      - name: Stage release
        id: package
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          if [[ "${GITHUB_REF_TYPE:-}" == tag ]]; then
            [[ "${GITHUB_REF_NAME#v}" == "${version}" ]]
          fi
          package="omawake-${version}-linux-${{ matrix.package_arch }}"
          mkdir -p "dist/${package}/lib" "dist/${package}/licenses"
          cargo about generate about.hbs > "dist/${package}/licenses/RUST-DEPENDENCIES.txt"
          cp target/release/omawake "dist/${package}/omawake"
          cp "${OMA_ORT_ROOT}/lib/libonnxruntime.so.${ORT_VERSION}" "dist/${package}/lib/"
          ln -s "libonnxruntime.so.${ORT_VERSION}" "dist/${package}/lib/libonnxruntime.so.1"
          ln -s libonnxruntime.so.1 "dist/${package}/lib/libonnxruntime.so"
          cp "${OMA_ORT_ROOT}/LICENSE" "dist/${package}/licenses/ONNX-RUNTIME-LICENSE"
          cp "${OMA_ORT_ROOT}/ThirdPartyNotices.txt" "dist/${package}/licenses/ONNX-RUNTIME-THIRD-PARTY-NOTICES"
          cp LICENSE "dist/${package}/licenses/OMAWAKE-LICENSE"
          cp THIRD_PARTY_NOTICES.md "dist/${package}/licenses/OMAWAKE-THIRD-PARTY-NOTICES"
          cp README.md INSTALL.md ACCELERATOR_SETUP.md CHANGELOG.md RELEASE_NOTES.md DEMO.md RUNTIME.md config.example.toml "dist/${package}/"
          mkdir -p "dist/${package}/benchmarks"
          cp benchmarks/README.md benchmarks/cuda-gb10-ort130-2026-09-14.md \
            "dist/${package}/benchmarks/"
          cp -a benchmarks/cuda-gb10-ort130-results-2026-09-14 \
            "dist/${package}/benchmarks/"
          cp -a assets packaging scripts "dist/${package}/"
          tar -C dist -cJf "dist/${package}.tar.xz" "${package}"
          (cd dist && sha256sum "${package}.tar.xz" > "${package}.sha256")
          echo "name=${package}" >> "${GITHUB_OUTPUT}"
      - name: Verify release contract
        run: |
          set -euo pipefail
          package='${{ steps.package.outputs.name }}'
          root="${RUNNER_TEMP}/${package}"
          mkdir -p "${root}"
          tar -C "${root}" -xJf "dist/${package}.tar.xz"
          binary="${root}/${package}/omawake"
          lib="${root}/${package}/lib"
          test -x "${binary}"
          test -e "${lib}/libonnxruntime.so"
          for document in README.md INSTALL.md ACCELERATOR_SETUP.md CHANGELOG.md RELEASE_NOTES.md DEMO.md RUNTIME.md config.example.toml; do
            test -s "${root}/${package}/${document}"
          done
          test -s "${root}/${package}/assets/omawake-mark.svg"
          test -s "${root}/${package}/benchmarks/cuda-gb10-ort130-2026-09-14.md"
          test -s "${root}/${package}/packaging/systemd/omawake.service"
          [[ $(find "${lib}" -maxdepth 1 \( -type f -o -type l \) | wc -l) == 3 ]]
          if readelf -d "${binary}" | grep -E 'NEEDED.*(onnxruntime|sherpa|openvino|cuda|cudnn|cublas|nvinfer)'; then
            echo "release executable must load ONNX Runtime dynamically" >&2
            exit 1
          fi
          ! compgen -G "${lib}/libonnxruntime_providers_*.so*" >/dev/null
          ! compgen -G "${lib}/libsherpa-onnx*.so*" >/dev/null
          licenses="${root}/${package}/licenses"
          [[ $(find "${licenses}" -maxdepth 1 -type f | wc -l) == 5 ]]
          cmp "${OMA_ORT_ROOT}/LICENSE" "${licenses}/ONNX-RUNTIME-LICENSE"
          cmp "${OMA_ORT_ROOT}/ThirdPartyNotices.txt" \
            "${licenses}/ONNX-RUNTIME-THIRD-PARTY-NOTICES"
          cmp LICENSE "${licenses}/OMAWAKE-LICENSE"
          cmp THIRD_PARTY_NOTICES.md "${licenses}/OMAWAKE-THIRD-PARTY-NOTICES"
          test -s "${licenses}/RUST-DEPENDENCIES.txt"
          "${binary}" setup runtime --json > /tmp/runtime.json
          python3 - <<'PY'
          import json
          report = json.load(open('/tmp/runtime.json', encoding='utf-8'))
          assert report['libraries']['runtime_loadable']['default']
          assert 'sherpa_library' not in report['libraries']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/${{ steps.package.outputs.name }}.tar.xz
            dist/${{ steps.package.outputs.name }}.sha256
          if-no-files-found: error

  publish:
    name: publish-linux-release
    needs: linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: omawake-*-linux-*
          path: dist
          merge-multiple: true
      - name: Verify and combine checksums
        run: |
          set -euo pipefail
          cd dist
          for checksum in omawake-*.sha256; do
            sha256sum -c "${checksum}"
          done
          sha256sum omawake-*.tar.xz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: omawake-linux-release-assets
          path: |
            dist/omawake-*.tar.xz
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/omawake-*.tar.xz
            dist/SHA256SUMS.txt
