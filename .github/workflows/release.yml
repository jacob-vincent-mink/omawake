name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-rc*"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  linux-x86_64:
    name: linux-x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      OMA_BUILD_JOBS: "4"
      OMA_NATIVE_ROOT: /tmp/omawake-native
      OMA_ORT_ROOT: /tmp/onnxruntime-linux-x64-1.29.0
      ORT_ARCHIVE_SHA256: c3fddc4f139a045b0c4902c57410f0694f1c2fdf9b6939fbe38b1aeae7cd14ba
      ORT_VERSION: 1.29.0
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git libasound2-dev patchelf pkg-config xz-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - name: Download the pinned CPU ONNX Runtime SDK
        run: |
          set -euo pipefail
          archive="/tmp/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          curl -fsSL --retry 3 -o "${archive}" \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          printf '%s  %s\n' "${ORT_ARCHIVE_SHA256}" "${archive}" | sha256sum -c -
          tar -C /tmp -xzf "${archive}"
          test -f "${OMA_ORT_ROOT}/include/onnxruntime_cxx_api.h"
          test -f "${OMA_ORT_ROOT}/lib/libonnxruntime.so.${ORT_VERSION}"

      - name: Build the patched sherpa companion library
        run: |
          set -euo pipefail
          native/sherpa/build.sh
          deps="${OMA_NATIVE_ROOT}/sherpa-build/_deps"
          cmp "${deps}/kaldi_native_fbank-src/LICENSE" licenses/native/KALDI-NATIVE-FBANK-LICENSE
          cmp "${deps}/kissfft-src/COPYING" licenses/native/KISSFFT-COPYING
          cmp "${deps}/kissfft-src/LICENSES/BSD-3-Clause" licenses/native/KISSFFT-BSD-3-CLAUSE
          cmp "${deps}/kaldi_decoder-src/LICENSE" licenses/native/KALDI-DECODER-LICENSE
          cmp "${deps}/kaldifst-src/LICENSE" licenses/native/KALDIFST-LICENSE
          cmp "${deps}/openfst-src/COPYING" licenses/native/OPENFST-COPYING
          cmp "${deps}/openfst-src/AUTHORS" licenses/native/OPENFST-AUTHORS
          cmp "${deps}/simple-sentencepiece-src/LICENSE" licenses/native/SIMPLE-SENTENCEPIECE-LICENSE
          cmp "${deps}/eigen-src/COPYING.README" licenses/native/EIGEN-COPYING-README
          cmp "${deps}/eigen-src/COPYING.MPL2" licenses/native/EIGEN-MPL-2.0
          cmp "${deps}/eigen-src/COPYING.APACHE" licenses/native/EIGEN-APACHE-2.0
          cmp "${deps}/eigen-src/COPYING.BSD" licenses/native/EIGEN-BSD
          cmp "${deps}/eigen-src/COPYING.MINPACK" licenses/native/EIGEN-MINPACK
          cmp "${deps}/json-src/LICENSE.MIT" licenses/native/NLOHMANN-JSON-MIT
          link_file="${OMA_NATIVE_ROOT}/sherpa-build/sherpa-onnx/c-api/CMakeFiles/sherpa-onnx-c-api.dir/link.txt"
          test -f "${link_file}"
          grep -oE '[^[:space:]]+\.a' "${link_file}" | sed 's|.*/||' | sort -u \
            > /tmp/actual-sherpa-archives.txt
          cat > /tmp/expected-sherpa-archives.txt <<'EOF'
          libkaldi-decoder-core.a
          libkaldi-native-fbank-core.a
          libkissfft-float.a
          libsherpa-onnx-core.a
          libsherpa-onnx-fst.a
          libsherpa-onnx-fstfar.a
          libsherpa-onnx-kaldifst-core.a
          libssentencepiece_core.a
          EOF
          diff -u /tmp/expected-sherpa-archives.txt /tmp/actual-sherpa-archives.txt

      - name: Build the runtime-neutral executable
        run: cargo build --release --locked

      - name: Stage the release
        id: package
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          if [[ "${GITHUB_REF_TYPE:-}" == tag ]]; then
            tag_version=${GITHUB_REF_NAME#v}
            tag_base=${tag_version%%-rc*}
            cargo_base=${version%%-rc*}
            [[ "${tag_base}" == "${cargo_base}" ]] || {
              echo "Cargo.toml version ${version} does not match tag ${GITHUB_REF_NAME}" >&2
              exit 1
            }
            version=${tag_version}
          fi
          package="omawake-${version}-linux-x86_64"
          mkdir -p "dist/${package}/lib" "dist/${package}/licenses"
          cargo about generate about.hbs > "dist/${package}/licenses/RUST-DEPENDENCIES.txt"
          cp target/release/omawake "dist/${package}/omawake"
          cp "${OMA_ORT_ROOT}/lib/libonnxruntime.so.${ORT_VERSION}" "dist/${package}/lib/"
          ln -s "libonnxruntime.so.${ORT_VERSION}" "dist/${package}/lib/libonnxruntime.so.1"
          ln -s libonnxruntime.so.1 "dist/${package}/lib/libonnxruntime.so"
          cp "${OMA_NATIVE_ROOT}/runtime/lib/libsherpa-onnx-c-api.so" "dist/${package}/lib/"
          cp "${OMA_ORT_ROOT}/LICENSE" "dist/${package}/licenses/ONNX-RUNTIME-LICENSE"
          cp "${OMA_ORT_ROOT}/ThirdPartyNotices.txt" \
            "dist/${package}/licenses/ONNX-RUNTIME-THIRD-PARTY-NOTICES"
          cp "${OMA_NATIVE_ROOT}/sherpa-onnx/LICENSE" "dist/${package}/licenses/SHERPA-ONNX-LICENSE"
          cp LICENSE "dist/${package}/licenses/OMAWAKE-LICENSE"
          cp THIRD_PARTY_NOTICES.md "dist/${package}/licenses/OMAWAKE-THIRD-PARTY-NOTICES"
          cp licenses/OMARCHY-LICENSE "dist/${package}/licenses/OMARCHY-LICENSE"
          cp native/sherpa/NOTICE "dist/${package}/licenses/SHERPA-ONNX-NOTICE"
          native_licenses=(
            EIGEN-APACHE-2.0
            EIGEN-BSD
            EIGEN-COPYING-README
            EIGEN-MINPACK
            EIGEN-MPL-2.0
            KALDI-DECODER-LICENSE
            KALDI-NATIVE-FBANK-LICENSE
            KALDIFST-LICENSE
            KISSFFT-BSD-3-CLAUSE
            KISSFFT-COPYING
            NLOHMANN-JSON-MIT
            OPENFST-AUTHORS
            OPENFST-COPYING
            SIMPLE-SENTENCEPIECE-LICENSE
          )
          for notice in "${native_licenses[@]}"; do
            cp "licenses/native/${notice}" "dist/${package}/licenses/${notice}"
          done
          cat > "dist/${package}/RUNTIME.md" <<'EOF'
          Omawake ships a working CPU default: ONNX Runtime 1.29.0 and the
          matching Oma-patched sherpa-onnx 1.13.8 C API are under lib/. The one
          executable also supports user-supplied OpenVINO and CUDA stacks. Run
          `omawake setup runtime` and provide the matching external core,
          patched sherpa, provider, and vendor libraries. Acceleration provider
          plugins are not bundled.
          EOF
          tar -C dist -cJf "dist/${package}.tar.xz" "${package}"
          (cd dist && sha256sum "${package}.tar.xz" > SHA256SUMS.txt)
          echo "name=${package}" >> "${GITHUB_OUTPUT}"

      - name: Verify the release contract
        run: |
          set -euo pipefail
          package='${{ steps.package.outputs.name }}'
          binary="dist/${package}/omawake"
          "${binary}" --version
          "${binary}" setup runtime --json > /tmp/runtime.json
          python3 - <<'PY'
          import json
          with open("/tmp/runtime.json", encoding="utf-8") as handle:
              report = json.load(handle)
          actual = set(report["supported_capabilities"])
          expected = {"cpu", "openvino", "cuda"}
          if actual != expected:
              raise SystemExit(f"capabilities {sorted(actual)} != {sorted(expected)}")
          if not report["libraries"]["runtime_loadable"]["default"]:
              raise SystemExit("packaged CPU default is not reported loadable")
          PY
          if readelf -d "${binary}" | grep -E 'libonnxruntime|libsherpa-onnx'; then
            echo "release executable must not link ONNX Runtime or sherpa-onnx" >&2
            exit 1
          fi
          lib="dist/${package}/lib"
          for required in \
            libonnxruntime.so \
            libonnxruntime.so.1 \
            "libonnxruntime.so.${ORT_VERSION}" \
            libsherpa-onnx-c-api.so; do
            test -e "${lib}/${required}"
          done
          [[ $(find "${lib}" -maxdepth 1 \( -type f -o -type l \) | wc -l) == 4 ]]
          ! compgen -G "${lib}/libonnxruntime_providers_*.so*" >/dev/null
          licenses="dist/${package}/licenses"
          expected_licenses=(
            EIGEN-APACHE-2.0
            EIGEN-BSD
            EIGEN-COPYING-README
            EIGEN-MINPACK
            EIGEN-MPL-2.0
            KALDI-DECODER-LICENSE
            KALDI-NATIVE-FBANK-LICENSE
            KALDIFST-LICENSE
            KISSFFT-BSD-3-CLAUSE
            KISSFFT-COPYING
            NLOHMANN-JSON-MIT
            OMAWAKE-LICENSE
            OMAWAKE-THIRD-PARTY-NOTICES
            OMARCHY-LICENSE
            ONNX-RUNTIME-LICENSE
            ONNX-RUNTIME-THIRD-PARTY-NOTICES
            OPENFST-AUTHORS
            OPENFST-COPYING
            RUST-DEPENDENCIES.txt
            SHERPA-ONNX-LICENSE
            SHERPA-ONNX-NOTICE
            SIMPLE-SENTENCEPIECE-LICENSE
          )
          [[ $(find "${licenses}" -maxdepth 1 -type f | wc -l) == ${#expected_licenses[@]} ]]
          for notice in "${expected_licenses[@]}"; do
            test -f "${licenses}/${notice}"
          done
          cmp "${OMA_ORT_ROOT}/LICENSE" "${licenses}/ONNX-RUNTIME-LICENSE"
          cmp "${OMA_ORT_ROOT}/ThirdPartyNotices.txt" \
            "${licenses}/ONNX-RUNTIME-THIRD-PARTY-NOTICES"
          cmp "${OMA_NATIVE_ROOT}/sherpa-onnx/LICENSE" \
            "${licenses}/SHERPA-ONNX-LICENSE"
          cmp LICENSE "${licenses}/OMAWAKE-LICENSE"
          cmp THIRD_PARTY_NOTICES.md "${licenses}/OMAWAKE-THIRD-PARTY-NOTICES"
          cmp licenses/OMARCHY-LICENSE "${licenses}/OMARCHY-LICENSE"
          cmp native/sherpa/NOTICE "${licenses}/SHERPA-ONNX-NOTICE"
          for notice in \
            EIGEN-APACHE-2.0 EIGEN-BSD EIGEN-COPYING-README EIGEN-MINPACK \
            EIGEN-MPL-2.0 KALDI-DECODER-LICENSE KALDI-NATIVE-FBANK-LICENSE \
            KALDIFST-LICENSE KISSFFT-BSD-3-CLAUSE KISSFFT-COPYING \
            NLOHMANN-JSON-MIT OPENFST-AUTHORS OPENFST-COPYING \
            SIMPLE-SENTENCEPIECE-LICENSE; do
            cmp "licenses/native/${notice}" "${licenses}/${notice}"
          done
          test -s "${licenses}/RUST-DEPENDENCIES.txt"
          LIB="${lib}" python3 - <<'PY'
          import ctypes
          import os

          lib = os.environ["LIB"]
          ctypes.CDLL(os.path.join(lib, "libonnxruntime.so"), mode=ctypes.RTLD_GLOBAL)
          sherpa = ctypes.CDLL(os.path.join(lib, "libsherpa-onnx-c-api.so"))
          sherpa.SherpaOnnxGetVersionStr.restype = ctypes.c_char_p
          assert sherpa.SherpaOnnxGetVersionStr() == b"1.13.8"
          assert sherpa.SherpaOnnxGetOmaRuntimeAbiVersion() == 1
          sherpa.SherpaOnnxCreateOrtRuntime.restype = ctypes.c_void_p
          runtime = sherpa.SherpaOnnxCreateOrtRuntime()
          assert runtime
          sherpa.SherpaOnnxDestroyOrtRuntime.argtypes = [ctypes.c_void_p]
          sherpa.SherpaOnnxDestroyOrtRuntime(runtime)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/${{ steps.package.outputs.name }}.tar.xz
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            dist/${{ steps.package.outputs.name }}.tar.xz
            dist/SHA256SUMS.txt
