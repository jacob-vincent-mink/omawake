[backend]
kind = "omawake-onnx"
runtime = "default"
device = "auto"
threads = 2
fallback = "error"
device_id = 0

[backend.options]
# ProfilingFilePrefix = "/tmp/omawake-openvino"

[model]
name = "sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
directory = ""
# The int8 graphs are the model's calibrated keyword-spotting artifacts.
encoder = "encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx"
decoder = "decoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx"
joiner = "joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx"
tokens = "tokens.txt"
bpe_model = "bpe.model"
sample_rate = 16000
keywords_score = 1.5
keywords_threshold = 0.25
max_active_paths = 4
num_trailing_blanks = 1

[audio]
device = "default"
channels = "mono"
buffer_milliseconds = 200

[daemon]
cooldown_milliseconds = 1500
queue_capacity = 8

[[wake_words]]
id = "computer"
phrase = "Computer"
enabled = true
command = ["notify-send", "Wake word heard"]
