[backend]
kind = "audiocpp"
runtime = "default"
device = "cpu"
threads = 2
fallback = "error"
device_id = 0
# Optional exact native provider library. Relative paths resolve from this file.
library = ""
library_dirs = []

[backend.options]
"audiocpp.asr_family" = "moonshine_asr"

[model]
name = "moonshine-streaming-tiny-q8_0-silero-v6.2.1"
directory = ""
verifier = "moonshine-streaming-tiny-q8_0.gguf"
vad = "silero_vad_16k.safetensors"
sample_rate = 16000

[audio]
device = "default"
channels = "mono"
buffer_milliseconds = 200

[daemon]
cooldown_milliseconds = 1500
queue_capacity = 8

[[wake_words]]
id = "computer"
phrase = "Computer"
enabled = true
command = ["notify-send", "Wake word heard"]
