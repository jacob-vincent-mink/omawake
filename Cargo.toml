[package]
name = "omawake"
version = "0.0.2-rc.1"
edition = "2024"
description = "Local wake-word detection CLI and daemon with runtime-selectable inference backends"
license = "MIT"
repository = "https://github.com/jacob-vincent-mink/omawake"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.16"
crossterm = "0.28"
hound = "3.5"
libc = "0.2"
libloading = "0.7"
rubato = { version = "0.16", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
thiserror = "2"
toml = "0.9"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
unicode-width = "0.2"
unicode-normalization = "0.1"
