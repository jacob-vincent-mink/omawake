[package]
name = "omawake"
version = "0.1.0"
edition = "2024"
description = "Local wake-word detection CLI and daemon with runtime-selectable inference backends"
license = "MIT"
repository = "https://github.com/jacob-vincent-mink/omawake"
readme = "README.md"

[dependencies]
anyhow = "1"
bzip2 = "0.5"
clap = { version = "4", features = ["derive"] }
cpal = "0.16"
crossterm = "0.28"
hound = "3.5"
libloading = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sentencepiece-rs = "0.2.2"
sha2 = "0.10"
signal-hook = "0.3"
tar = "0.4"
thiserror = "2"
toml = "0.9"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
unicode-width = "0.2"
