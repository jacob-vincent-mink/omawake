[backend]
kind = "omawake-onnx"
runtime = "openvino"
device = "npu"
threads = 2
fallback = "error"
device_id = 0
library_dirs = [
    "/tmp/onnxruntime-ep-openvino-1.7.0/onnxruntime_ep_openvino",
    "/tmp/omawake-rc2-final-stage-output-clean/lib",
]
onnxruntime_library = "/tmp/omawake-rc2-final-stage-output-clean/lib/libonnxruntime.so"
provider_library = "/tmp/onnxruntime-ep-openvino-1.7.0/onnxruntime_ep_openvino/libonnxruntime_providers_openvino_plugin.so"

[backend.options]

[model]
name = "sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
directory = ""
encoder = "encoder-epoch-12-avg-2-chunk-16-left-64.onnx"
decoder = "decoder-epoch-12-avg-2-chunk-16-left-64.onnx"
joiner = "joiner-epoch-12-avg-2-chunk-16-left-64.onnx"
tokens = "tokens.txt"
bpe_model = "bpe.model"
sample_rate = 16000
keywords_score = 1.5
keywords_threshold = 0.25
max_active_paths = 4
num_trailing_blanks = 1

[audio]
device = "default"
channels = "mono"
buffer_milliseconds = 200

[daemon]
cooldown_milliseconds = 1500
queue_capacity = 8

[[wake_words]]
id = "computer"
phrase = "Computer"
enabled = true
command = [
    "notify-send",
    "Wake word heard",
]

[[wake_words]]
id = "light-up"
phrase = "Light Up"
enabled = true
command = ["true"]

[[wake_words]]
id = "lovely-child"
phrase = "Lovely Child"
enabled = true
command = ["true"]

[[wake_words]]
id = "forever"
phrase = "Forever"
enabled = true
command = ["true"]
